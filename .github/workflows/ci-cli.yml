name: ci-cli

on:
  push:
    branches: [master, main]
    paths:
      - "cli/**"
      - ".github/workflows/ci-cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/ci-cli.yml"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["18", "20"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
